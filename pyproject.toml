[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-of-korea-ecos-cli"
version = "0.1.0"
description = "CLI for Bank of Korea ECOS Open API: list statistic tables and fetch time series"
readme = "README.md"
authors = [{ name = "Chloe" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["requests>=2.28.0"]

[project.scripts]
ecos-cli = "bok_ecos.cli:main"
